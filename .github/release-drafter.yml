name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

autolabeler:
  - label: 'breaking'
    title:
      - '/^(\w+)(\(\w+\))?!:/'
  - label: 'feat'
    title:
      - '/^feat(\(\w+\))?:/'
  - label: 'fix'
    title:
      - '/^fix(\(\w+\))?:/'
  - label: 'docs'
    title:
      - '/^docs(\(\w+\))?:/'
  - label: 'test'
    title:
      - '/^test(\(\w+\))?:/'
  - label: 'chore'
    title:
      - '/^chore(\(\w+\))?:/'
  - label: 'perf'
    title:
      - '/^perf(\(\w+\))?:/'
  - label: 'security'
    title:
      - '/^security(\(\w+\))?:/'

categories:
  - title: '🚀 Features'
    labels:
      - 'feat'
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '🔒 Security'
    labels:
      - 'security'
  - title: '📚 Documentation'
    labels:
      - 'docs'
      - 'documentation'
  - title: '⚡ Performance'
    labels:
      - 'perf'
      - 'performance'
  - title: '🧪 Tests'
    labels:
      - 'test'
      - 'tests'
  - title: '🔧 Maintenance'
    labels:
      - 'chore'
      - 'dependencies'
      - 'ci'

version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking'
  minor:
    labels:
      - 'minor'
      - 'feat'
      - 'feature'
  patch:
    labels:
      - 'patch'
      - 'fix'
      - 'bugfix'
  default: patch

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
