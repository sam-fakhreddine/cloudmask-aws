name: Release Drafter

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - master
    paths-ignore:
      - 'pyproject.toml'
      - 'src/cloudmask/__version__.py'
      - 'CHANGELOG.md'

permissions:
  contents: write
  pull-requests: write

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
