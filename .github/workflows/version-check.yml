name: Version Check

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]
    paths:
      - 'src/cloudmask/__version__.py'
      - 'pyproject.toml'
      - 'CHANGELOG.md'

jobs:
  check-version: # yamllint disable-line rule:truthy
    runs-on: # yamllint disable-line rule:truthy ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check version consistency
      run: |
        VERSION_PY=$(grep -oP '__version__ = "\K[^"]+' src/cloudmask/__version__.py)
        VERSION_TOML=$(grep -oP 'version = "\K[^"]+' pyproject.toml | head -1)

        if [ "$VERSION_PY" != "$VERSION_TOML" ]; then
          echo "Version mismatch: __version__.py ($VERSION_PY) != pyproject.toml ($VERSION_TOML)"
          exit 1
        fi

        if ! grep -q "## \[$VERSION_PY\]" CHANGELOG.md; then
          echo "Version $VERSION_PY not found in CHANGELOG.md"
          exit 1
        fi

        echo "All versions are consistent: $VERSION_PY"
