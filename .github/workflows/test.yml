name: Tests

on: # yamllint disable-line rule:truthy
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv pip install --system -e ".[dev]"

    - name: Auto-fix code issues
      run: |
        uv run ruff check --fix src/cloudmask/ tests/ examples/ || true
        uv run black src/cloudmask/ tests/ examples/

    - name: Check code formatting with Black
      run: |
        uv run black --check src/cloudmask/ tests/ examples/

    - name: Lint with Ruff
      run: |
        uv run ruff check src/cloudmask/ tests/ examples/

    - name: Type check with Mypy
      run: |
        uv run mypy src/cloudmask/

    - name: Check docstrings with Pydocstyle
      run: |
        uv run pydocstyle src/cloudmask/

    - name: Run tests with pytest
      run: |
        uv run pytest tests/ -v --cov=cloudmask --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      if: matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
