name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@3981f43b91ca498c8991e9c7f7c3e6c8d2bfbf8e # v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv pip install --system -e ".[dev]"

    - name: Auto-fix code issues
      run: |
        uv run ruff check --fix src/cloudmask/ tests/ examples/ || true
        uv run black src/cloudmask/ tests/ examples/

    - name: Check code formatting with Black
      run: |
        uv run black --check src/cloudmask/ tests/ examples/

    - name: Lint with Ruff
      run: |
        uv run ruff check src/cloudmask/ tests/ examples/

    - name: Type check with Mypy
      run: |
        uv run mypy src/cloudmask/

    - name: Check docstrings with Pydocstyle
      run: |
        uv run pydocstyle src/cloudmask/

    - name: Run tests with pytest
      run: |
        uv run pytest tests/ -v --cov=cloudmask --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@e28ff129e5465c2c0dcc6f003fc735cb6ae0c673 # v4
      if: matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
